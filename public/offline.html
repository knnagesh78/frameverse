  <body><main class="card"><span class="logo" aria-hidden="true">◈</span><p class="eyebrow">FrameVerse</p><h1>You're offline.</h1><p>Reconnect to explore photographs and open your profile. Your account and photos will be here when you’re back online.</p><a class="button" href="/">Try again</a></main></body>
